ShortDescription: Zero-cost background Windows service synchronizing Obsidian vaults with private GitHub repositories.
Description: |
  Synapse is a local-first Windows background service that keeps your Obsidian vault synchronized with a private GitHub repository.
  It includes intelligent 3-way conflict resolution, automated frontmatter & tagging rules, and a lightweight system tray status app.
